[project]
name = "coso-rag-web"
version = "1.0.0"
description = "Web view of the cited Q&A system, as a Vercel Python function."
requires-python = "==3.12.*"
# runtime only, pinned to the versions the evaluation ran with; CPU torch (the CUDA build would not fit)
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "numpy==2.5.4",
    "bm25s==0.3.13",
    "sentence-transformers==6.1.0",
    "transformers==5.19.0",
    "tokenizers==0.23.3",
    "huggingface-hub==1.33.0",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "pymupdf==1.28.2",
    "boto3==1.43.111",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vercel.scripts]
build = "python build.py"

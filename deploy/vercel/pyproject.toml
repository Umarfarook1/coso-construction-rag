[project]
name = "coso-rag-web"
version = "2.0.0"
description = "Web view of the cited Q&A system, as a Vercel Python function. Every model is a Bedrock API call."
requires-python = "==3.12.*"
# runtime only: no PyTorch and no model weights (the fine-tuned reranker runs locally, see the repository README)
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "numpy==2.5.4",
    "bm25s==0.3.13",
    "pymupdf==1.28.2",
    "boto3==1.43.111",
]

[tool.uv]
package = false
